name: Pobierz zdjęcia z Lovable

on:
  workflow_dispatch:
  push:
    branches: [claude/brave-carson-2u3xgp]
    paths: [.github/workflows/fetch-lovable-assets.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pobierz zdjęcia
        run: node scripts/fetch-lovable-assets.mjs
      - name: Pobierz obrazek OG
        run: curl -fsSL -o public/og-image.png "https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/906bc37b-f339-47ab-afc7-e16ca425e4bc/id-preview-6d125d8b--bf3d4489-09f4-4b49-b539-caebf92d5b0f.lovable.app-1780573278007.png"
      - name: Sprawdź pliki
        run: file src/assets/lovable/* public/og-image.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/lovable public/og-image.png
          git commit -m "Pobranie zdjęć z Lovable do repozytorium" || echo "Brak zmian"
          git push
