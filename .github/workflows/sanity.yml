name: Sanity Studio

on:
  push:
    branches: [main]
    paths: [studio/**]
  workflow_dispatch:
    inputs:
      seed:
        description: "Wgraj obecne treści i zdjęcia strony do Sanity (pomija istniejące dokumenty)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # uruchomienie przebudowy strony po imporcie treści

jobs:
  studio:
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź konfigurację
        id: config
        working-directory: .
        run: |
          if grep -q '"projectId": ""' studio/sanity.project.json; then
            echo "::notice::Brak ID projektu Sanity w studio/sanity.project.json — pomijam."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error::Brak sekretu SANITY_AUTH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Wgraj treści do Sanity
        if: steps.config.outputs.ready == 'true' && inputs.seed
        run: npm run seed
      - name: Wdróż Studio (https://dalkowski.sanity.studio)
        if: steps.config.outputs.ready == 'true'
        run: npx sanity deploy -y
      - name: Przebuduj stronę z treściami z Sanity
        if: steps.config.outputs.ready == 'true' && inputs.seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
